name: Build RPG Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # commit adiminin repoya push edebilmesi icin sart

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 1) Gradle'i CI uzerinde kurar (internete cikip indirir) - gradlew'e ihtiyac duymaz
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1   # ForgeGradle 6.x ile uyumlu surum

      # 2) Gercek gradlew / gradlew.bat / gradle/wrapper dosyalarini olusturur
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.1.1

      # 3) Wrapper dosyalarini repoya commit'ler ki bir daha bu adima gerek kalmasin
      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet || git commit -m "chore: add generated Gradle wrapper"
          git push
        continue-on-error: true   # wrapper zaten commitliyse veya push izni yoksa akisi durdurma

      # 4) Artik gercek wrapper ile derle
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with wrapper
        run: ./gradlew build --no-daemon

      # 5) Derlenen mod .jar dosyasini "Artifacts" olarak yukler -
      #    Actions calisma ekraninin en altinda indirme butonu olarak cikar
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rpgmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
